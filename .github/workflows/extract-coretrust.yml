name: CoreTrust 27.0 Extraction

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/extract-coretrust.yml"

permissions:
  contents: read

jobs:
  extract:
    name: Extract iOS 27.0 CoreTrust
    runs-on: macos-15
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install blacktop/tap/ipsw jq

          ipsw version

      - name: Prepare directories
        run: |
          mkdir -p firmware extracted reports

      - name: Download iOS 27.0 dyld cache
        run: |
          ipsw download ipsw \
            --device iPhone14,5 \
            --build 24A437 \
            --dyld \
            --dyld-arch arm64e \
            --output firmware \
            --confirm

      - name: Locate dyld shared cache
        run: |
          DSC=$(find firmware \
            -type f \
            -name "dyld_shared_cache_arm64e" \
            | head -n 1)

          if [ -z "$DSC" ]; then
            echo "::error::No arm64e dyld shared cache found."
            find firmware -type f
            exit 1
          fi

          echo "DSC=$DSC" >> "$GITHUB_ENV"

          echo "Found shared cache:"
          ls -lh "$DSC"

      - name: Inventory dyld images
        run: |
          ipsw dyld info \
            --dylibs \
            --json \
            "$DSC" \
            > reports/dylibs.json

          jq -r '.dylibs[].name' \
            reports/dylibs.json \
            > reports/image-list.txt

      - name: Find CoreTrust-related images
        run: |
          grep -iE \
            'coretrust|libmis|amfi|codesign' \
            reports/image-list.txt \
            | tee reports/candidates.txt || true

          if [ ! -s reports/candidates.txt ]; then
            echo "No matching image names found."
          fi

      - name: Extract CoreTrust images
        run: |
          mkdir -p extracted/CoreTrust

          while IFS= read -r IMAGE; do
            [ -z "$IMAGE" ] && continue

            echo "Extracting: $IMAGE"

            ipsw dyld extract \
              "$DSC" \
              "$IMAGE" \
              --output extracted/CoreTrust \
              || echo "Extraction failed for: $IMAGE"

          done < reports/candidates.txt

      - name: Generate checksums
        run: |
          find extracted -type f \
            -exec shasum -a 256 {} \; \
            > reports/SHA256SUMS.txt

          echo "Extracted files:"
          find extracted -type f -exec ls -lh {} \;

      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: CoreTrust-iOS-27.0-arm64e
          path: |
            extracted/
            reports/
          if-no-files-found: error
          retention-days: 14
