name: Extract CoreTrust - iOS 27.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install IPSW tools
        run: |
          brew update
          brew install blacktop/tap/ipsw

      - name: Check IPSW tool
        run: |
          ipsw version

      - name: Download firmware
        run: |
          mkdir -p firmware extracted
          ipsw download ipsw \
            --device iPhone14,5 \
            --version 27.0 \
            --output firmware/

      - name: Inspect downloaded firmware
        run: |
          find firmware -type f -maxdepth 2 -print

      - name: Extract firmware
        run: |
          IPSW=$(find firmware -name "*.ipsw" -type f | head -n 1)

          if [ -z "$IPSW" ]; then
            echo "Firmware download failed."
            exit 1
          fi

          ipsw extract --dyld "$IPSW" -o extracted/

      - name: Locate CoreTrust artifacts
        run: |
          find extracted -type f \
            \( -iname '*CoreTrust*' \
            -o -iname '*Security*' \
            -o -iname '*AMFI*' \) \
            -print | tee extracted/coretrust-files.txt

      - name: Package results
        run: |
          tar -czf coretrust27-artifacts.tar.gz extracted/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CoreTrust27-iOS-27.0
          path: coretrust27-artifacts.tar.gz
          retention-days: 7
:::

### Running it

1. Commit the workflow.
2. Open your repository's **Actions** tab.
3. Select `Extract CoreTrust - iOS 27.0`.
4. Press **Run workflow**.
5. Download `CoreTrust27-iOS-27.0`.

### Next milestone

Once you upload the artifact here, we'll inspect the extracted files and identify the actual CoreTrust implementation.

**Our target remains iOS 27.0 build 24A437.**
