name: CoreTrust27 - Firmware Extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    name: Extract iOS 27.0 CoreTrust
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install IPSW
        run: |
          brew install blacktop/tap/ipsw
          ipsw version

      - name: Create directories
        run: |
          mkdir -p firmware extracted reports

      - name: Download iOS 27.0
        run: |
          ipsw download ipsw \
            --device iPhone14,5 \
            --version 27.0 \
            --output firmware/

      - name: Verify firmware
        run: |
          IPSW=$(find firmware -type f -name "*.ipsw" | head -n 1)

          if [ -z "$IPSW" ]; then
            echo "::error::No IPSW downloaded."
            exit 1
          fi

          echo "IPSW=$IPSW" >> "$GITHUB_ENV"
          ls -lh "$IPSW"

          ipsw info "$IPSW"

      - name: Extract dyld shared cache
        run: |
          ipsw extract \
            --dyld \
            --dyld-arch arm64e \
            --output extracted/ \
            "$IPSW"

      - name: Locate shared cache
        run: |
          find extracted -type f -print

          DSC=$(find extracted -type f \
            -name "dyld_shared_cache_arm64e" | head -n 1)

          if [ -z "$DSC" ]; then
            echo "::error::arm64e shared cache not found."
            exit 1
          fi

          echo "DSC=$DSC" >> "$GITHUB_ENV"

      - name: Inspect shared cache
        run: |
          ipsw dyld info "$DSC" | tee reports/dyld-info.txt

      - name: Locate CoreTrust
        run: |
          ipsw dyld info "$DSC" \
            > reports/dyld-inventory.txt

          grep -i -n -E \
            'CoreTrust|CoreTrust.framework' \
            reports/dyld-inventory.txt \
            | tee reports/coretrust-search.txt || true

      - name: Extract CoreTrust image
        run: |
          mkdir -p extracted/CoreTrust

          ipsw dyld extract "$DSC" CoreTrust \
            -o extracted/CoreTrust/ || true

          find extracted/CoreTrust -type f -print

      - name: Generate checksums
        run: |
          find extracted -type f -exec shasum -a 256 {} \; \
            > reports/SHA256SUMS.txt

      - name: Package research artifacts
        run: |
          tar -czf CoreTrust27-iOS-27.0.tar.gz \
            extracted reports

          ls -lh CoreTrust27-iOS-27.0.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CoreTrust27-iOS-27.0
          path: CoreTrust27-iOS-27.0.tar.gz
          if-no-files-found: error
          retention-days: 7
